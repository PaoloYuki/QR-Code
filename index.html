<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Journée Caritative</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .date {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            line-height: 1.6;
            font-size: 17px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 22px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎗️ Journée Caritative</h1>

            <div class="date">
                Samedi 15 novembre
            </div>

            <p class="description">
                Venez participer à notre journée caritative !
                Concert, animations, rencontres et collecte de dons
                seront au programme.
            </p>

            <p>
                📍 Salle des fêtes
            </p>

            <a href="#" class="button">
                Faire un don
            </a>

        </div>

    </div>

</body>
</html>
